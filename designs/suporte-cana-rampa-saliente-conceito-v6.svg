<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="800" viewBox="0 0 1380 800">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#308564" stroke-width="2"/></marker>
    <g id="fixed">
      <path d="M27 12H294Q320 12 320 38V100H277Q248 54 199 54Q138 54 115 124H105V82H10V37Q10 12 27 12Z" fill="#2d4350" stroke="#1e303a" stroke-width="4" stroke-linejoin="round"/>
      <path d="M117 124Q134 62 199 62Q247 62 269 101" fill="none" stroke="#84b0af" stroke-width="7" stroke-linecap="round"/>
      <rect x="34" y="80" width="24" height="10" rx="3" fill="#2d4350" stroke="#1e303a" stroke-width="2"/>
    </g>
    <g id="jaw">
      <path d="M100 94L112 124Q126 184 195 199Q269 197 289 145L332 96Q334 94 335 98L329 112L320 126V201Q320 224 294 224H30Q10 224 10 202V159H75Q100 154 100 134Z" fill="#e7a258" stroke="#a9622f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M108 139Q133 190 195 191Q260 190 281 144" fill="none" stroke="#80b5a4" stroke-width="7" stroke-linecap="round"/>
      <path d="M312 119L333 97" fill="none" stroke="#f4d342" stroke-width="7" stroke-linecap="round"/>
      <rect x="34" y="151" width="24" height="10" rx="3" fill="#e7a258" stroke="#a9622f" stroke-width="2"/>
    </g>
    <g id="pivot"><circle cx="100" cy="94" r="12" fill="#1671d8" stroke="#114a91" stroke-width="4"/><circle cx="100" cy="94" r="4" fill="white"/></g>
    <g id="spring"><path d="M46 91V96L35 102L57 110L35 118L57 126L35 134L57 142L46 149V151" fill="none" stroke="#e4403d" stroke-width="5" stroke-linejoin="round"/></g>
    <g id="spring-compressed"><path d="M46 91L35 98L57 104L35 110L57 116L35 122L46 128" fill="none" stroke="#e4403d" stroke-width="5" stroke-linejoin="round"/></g>
  </defs>
  <rect width="1380" height="800" fill="#f3f7f9"/>
  <text x="42" y="58" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#173d55">Suporte de cana • rampa saliente para a cana acionar o fecho</text>
  <text x="42" y="88" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#587486">Conceito V6 • vista frontal esquemática</text>

  <rect x="32" y="124" width="420" height="530" rx="18" fill="white" stroke="#d4e1e8"/>
  <text x="55" y="160" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#173d55">1  Fechado, espaço livre</text>
  <text x="55" y="187" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#587486">Câmara vazia entre os braços, com apoios para a mola.</text>
  <g transform="translate(76 282)">
    <ellipse cx="198" cy="129" rx="79" ry="67" fill="#d4dee3"/><path d="M260 94H320V150H260Z" fill="#d4dee3"/>
    <use href="#fixed"/><use href="#jaw"/><use href="#pivot"/><use href="#spring"/>
    <text x="145" y="124" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#5c6d75">cavidade livre</text>
  </g>
  <text x="55" y="604" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#173d55">A mola assenta num apoio azul e noutro castanho.</text>
  <text x="55" y="630" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#587486">O veio azul fica acima e à direita da mola.</text>

  <rect x="480" y="124" width="420" height="530" rx="18" fill="white" stroke="#d4e1e8"/>
  <text x="503" y="160" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#173d55">2  A cana empurra a rampa</text>
  <text x="503" y="187" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#587486">A cana encontra a ponta saliente antes do corpo azul.</text>
  <g transform="translate(524 282)">
    <ellipse cx="198" cy="129" rx="79" ry="67" fill="#d4dee3"/><path d="M260 94H320V150H260Z" fill="#d4dee3"/>
    <use href="#fixed"/>
    <use href="#jaw" transform="rotate(17 100 94)"/>
    <use href="#pivot"/><use href="#spring-compressed"/>
    <circle cx="342" cy="123" r="35" fill="#aebec8" stroke="#657b86" stroke-width="3"/>
    <path d="M382 123H314" fill="none" stroke="#308564" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <text x="503" y="604" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#173d55">A rampa leva o braço castanho a abrir.</text>
  <text x="503" y="630" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#587486">A mola comprime-se dentro do espaço aberto.</text>

  <rect x="928" y="124" width="420" height="530" rx="18" fill="white" stroke="#d4e1e8"/>
  <text x="951" y="160" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#173d55">3  Cana dentro, fecho encostado</text>
  <text x="951" y="187" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#587486">A mola devolve a peça; o vão cinzento acolhe a cana.</text>
  <g transform="translate(972 282)">
    <ellipse cx="198" cy="129" rx="79" ry="67" fill="#d4dee3"/><path d="M260 94H320V150H260Z" fill="#d4dee3"/>
    <use href="#fixed"/>
    <circle cx="198" cy="129" r="38" fill="#899aa4" stroke="#607782" stroke-width="3"/>
    <use href="#jaw"/><use href="#pivot"/><use href="#spring"/>
    <text x="178" y="135" font-family="DejaVu Sans,sans-serif" font-size="14" fill="white">cana</text>
  </g>
  <text x="951" y="604" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#173d55">O modo de libertação manual ainda será definido.</text>
  <text x="951" y="630" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#587486">A ponta amarela sobressai ligeiramente à direita.</text>

  <rect x="32" y="675" width="1316" height="88" rx="14" fill="#e3edf1"/>
  <text x="56" y="707" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#173d55">Referência dimensional provisória: ≈ 67 × 37 × 21 mm • cana até Ø 21 mm • corpo PETG/ASA • mola e pino inox • apoios TPU</text>
  <text x="56" y="737" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#587486">Faltam medir a cana real e definir a fixação; o curso do mordente e a mola serão dimensionados a partir dessas medidas.</text>
</svg>
