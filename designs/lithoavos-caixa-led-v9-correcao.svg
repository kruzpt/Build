<text x="135" y="525" font-family="sans-serif" font-size="19" fill="#516873">Tampa maciça, encaixada e colada</text>
<rect x="640" y="140" width="505" height="460" rx="16" fill="white" stroke="#c8d4d3" stroke-width="3"/>
<text x="668" y="184" font-family="sans-serif" font-size="27" font-weight="bold" fill="#223842">Corte: frente → costas</text>
