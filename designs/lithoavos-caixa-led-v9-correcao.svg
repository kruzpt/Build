<rect x="992" y="356" width="22" height="27" fill="#243d4a" stroke="#c5424b" stroke-width="2"/>
<text x="755" y="320" font-family="sans-serif" font-size="20" fill="#223842">≈ 15 mm</text>
<text x="695" y="500" font-family="sans-serif" font-size="18" fill="#516873">litofania → ar → LED → tampa opaca</text>
<text x="694" y="535" font-family="sans-serif" font-size="18" fill="#c5424b">A ficha entra por trás, perpendicular à tampa.</text>
